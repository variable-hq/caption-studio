name: ChurchLiveCaption

options:
  minimumXcodeGenVersion: 2.46.0
  bundleIdPrefix: com.lukaskawira
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    APP_BASE_URL: https://church-live-caption.lukas-ka.workers.dev/

targets:
  ChurchLiveCaption:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ChurchLiveCaption
    info:
      path: ChurchLiveCaption/Info.plist
      properties:
        CFBundleDisplayName: Caption Studio
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppBaseURL: $(APP_BASE_URL)
        NSMicrophoneUsageDescription: Caption Studio uses your microphone during an audio test or live service to transcribe and translate speech into captions.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lukaskawira.churchlivecaption
        PRODUCT_NAME: ChurchLiveCaption
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets:
        - ChurchLiveCaptionTests

  ChurchLiveCaptionTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ChurchLiveCaptionTests
    dependencies:
      - target: ChurchLiveCaption
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lukaskawira.churchlivecaption.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  ChurchLiveCaption:
    build:
      targets:
        ChurchLiveCaption: all
        ChurchLiveCaptionTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - ChurchLiveCaptionTests
    run:
      config: Debug
    archive:
      config: Release
